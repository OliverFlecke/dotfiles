config_version = 14

[calendar]
	enabled = true
[location]
	auto_locate = true
[control_center.calendar]
	show_week_numbers = true
[nightlight]
	enabled = true

[shell.panel]
	clipboard_placement = "attached"
	transparency_mode = "glass"

[theme]
	builtin = "Ayu"
	community_palette = "Oxocarbon"
	mode = "dark"
	source = "wallpaper"
	wallpaper_scheme = "m3-content"

[wallpaper]
	directory = "/home/oliver/wallpaper/other"
	enabled = true
	fill_mode = "fit"

	[wallpaper.automation]
		enabled = true
		interval_seconds = 60
		order = "random"
		recursive = true
	[wallpaper.default]
		path = "/home/oliver/wallpaper/default/wallhaven-ogy6zm.jpg"
	[wallpaper.last]
		path = "/home/oliver/wallpaper/default/wallhaven-ogy6zm.jpg"

[widget.workspaces]
	style = "minimal"

[shell.screenshot]
	directory = "/home/oliver/screenshot/"
