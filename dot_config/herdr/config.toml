# Only overrides are kept here; see https://herdr.dev for all options and defaults.
onboarding = false
[theme]
	name = "tokyo-night"
[keys]
	goto = "prefix+/"
	focus_agent = "prefix+shift+1..9" # optional indexed binding, e.g. "prefix+alt+1..9"
	switch_workspace = "prefix+ctrl+shift+1..9" # optional indexed binding, e.g. "prefix+shift+1..9"
	focus_pane_down = "prefix+j"
	focus_pane_left = "prefix+h"
	focus_pane_right = "prefix+l"
	focus_pane_up = "prefix+k"
	split_vertical = "prefix+shift+\\"
	split_horizontal = "prefix+minus"
	navigate_workspace_down = "j"
	navigate_workspace_up = "k"
	[[keys.command]]
		command = "lazygit"
		description = "Open lazygit"
		height = "95%"
		width = "95%"
		key = "prefix+g"
		type = "popup"
	[[keys.command]]
		command = "gh dash"
		height = "100%"
		width = "100%"
		description = "Open gh dash"
		key = "prefix+p"
		type = "popup"
	[[keys.command]]
		command = "gh enhance"
		description = "Open gh enhance"
		key = "prefix+a"
		type = "pane"
	[[keys.command]]
		command = "lazydocker"
		description = "Open lazydocker"
		height = "100%"
		width = "100%"
		key = "prefix+shift+D"
		type = "popup"
[ui]
	pane_borders = true
	pane_gaps = false
[experimental]
	pane_history = false
